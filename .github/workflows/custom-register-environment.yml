
name: register-environment

on:
  workflow_call:
    inputs:
      environment_file:
        required: true
        type: string
      resource_group:
        required: true
        type: string
      workspace_name:
        required: true
        type: string
      conda_file:
        required: false
        default: ""
        type: string
      dockerfile-location:
        required: false
        default: ""
        type: string

jobs:
  register-environment:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Login to Azure using OIDC
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Step 3: Verify Azure connection
      - name: Verify Azure Connection
        run: |
          az account show --output table

      # Step 4: Install Azure ML CLI extension
      - name: Install Azure ML Extension
        run: |
          az extension add --name ml --yes

      # Step 5: Update Azure ML CLI extension
      - name: Update Azure ML Extension
        run: |
          az extension update --name ml

      # Step 6: List installed extensions
      - name: List Azure CLI Extensions
        run: |
          az extension list --output table

      # Step 7: Create environment with Docker build context
      - name: Create Environment - Docker
        if: ${{ inputs['dockerfile-location'] != '' }}
        env:
          ENVIRONMENT_FILE: ${{ inputs.environment_file }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          DOCKER_CONTEXT: ${{ inputs['dockerfile-location'] }}
        run: |
          az ml environment create \
            --file "$GITHUB_WORKSPACE/$ENVIRONMENT_FILE" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME" \
            --build-context "$GITHUB_WORKSPACE/$DOCKER_CONTEXT"

      # Step 8: Create environment with Conda
      - name: Create Environment - Conda
        if: ${{ inputs['dockerfile-location'] == '' && inputs.conda_file != '' }}
        env:
          ENVIRONMENT_FILE: ${{ inputs.environment_file }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          CONDA_FILE: ${{ inputs.conda_file }}
        run: |
          az ml environment create \
            --file "$GITHUB_WORKSPACE/$ENVIRONMENT_FILE" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME" \
            --conda-file "$GITHUB_WORKSPACE/$CONDA_FILE"

      # Step 9: Create environment from YAML only
      - name: Create Environment - YAML
        if: ${{ inputs['dockerfile-location'] == '' && inputs.conda_file == '' }}
        env:
          ENVIRONMENT_FILE: ${{ inputs.environment_file }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
        run: |
          az ml environment create \
            --file "$GITHUB_WORKSPACE/$ENVIRONMENT_FILE" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME"
