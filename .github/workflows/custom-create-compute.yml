
name: create-compute

on:
  workflow_call:
    inputs:
      cluster_name:
        required: true
        type: string
      size:
        required: true
        type: string
      min_instances:
        required: true
        type: number
      max_instances:
        required: true
        type: number
      resource_group:
        required: true
        type: string
      workspace_name:
        required: true
        type: string
      cluster_tier:
        required: false
        type: string

jobs:
  create-compute:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # Step 1: Login to Azure using OIDC
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Step 2: Verify Azure authentication
      - name: Verify Azure Login
        run: |
          az account show --output table

      # Step 3: Install Azure ML CLI extension
      - name: Install Azure ML Extension
        run: |
          az extension add --name ml --yes

      # Step 4: Update Azure ML CLI extension
      - name: Update Azure ML Extension
        run: |
          az extension update --name ml

      # Step 5: Create compute with default tier
      - name: Create Compute - Default Tier
        if: ${{ inputs.cluster_tier == '' }}
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          VM_SIZE: ${{ inputs.size }}
          MIN_INSTANCES: ${{ inputs.min_instances }}
          MAX_INSTANCES: ${{ inputs.max_instances }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
        run: |
          az ml compute create \
            --name "$CLUSTER_NAME" \
            --type AmlCompute \
            --tier dedicated \
            --size "$VM_SIZE" \
            --min-instances "$MIN_INSTANCES" \
            --max-instances "$MAX_INSTANCES" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME"

      # Step 6: Create compute with specified tier
      - name: Create Compute - Custom Tier
        if: ${{ inputs.cluster_tier != '' }}
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          VM_SIZE: ${{ inputs.size }}
          MIN_INSTANCES: ${{ inputs.min_instances }}
          MAX_INSTANCES: ${{ inputs.max_instances }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          CLUSTER_TIER: ${{ inputs.cluster_tier }}
        run: |
          az ml compute create \
            --name "$CLUSTER_NAME" \
            --type AmlCompute \
            --tier "$CLUSTER_TIER" \
            --size "$VM_SIZE" \
            --min-instances "$MIN_INSTANCES" \
            --max-instances "$MAX_INSTANCES" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME"
