
name: run-pipeline

on:
  workflow_call:
    inputs:
      parameters-file:
        required: true
        type: string
      resource_group:
        required: true
        type: string
      workspace_name:
        required: true
        type: string
      job-name:
        required: true
        type: string

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    timeout-minutes: 360

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Login to Azure using OIDC
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Step 3: Verify Azure connection
      - name: Verify Azure Connection
        run: |
          az account show --output table

      # Step 4: Install Azure ML extension
      - name: Install Azure ML Extension
        run: |
          az extension add --name ml --yes

      # Step 5: Update Azure ML extension
      - name: Update Azure ML Extension
        run: |
          az extension update --name ml

      # Step 6: Submit and monitor Azure ML pipeline
      - name: Run Azure ML Pipeline
        shell: bash
        env:
          PARAMETERS_FILE: ${{ inputs['parameters-file'] }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          JOB_NAME: ${{ inputs['job-name'] }}
        run: |
          set -euo pipefail

          echo "Submitting Azure ML pipeline..."

          if [[ ! -f "$GITHUB_WORKSPACE/$PARAMETERS_FILE" ]]; then
            echo "Pipeline YAML file not found"
            exit 1
          fi

          run_id=$(az ml job create \
            --file "$GITHUB_WORKSPACE/$PARAMETERS_FILE" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME" \
            --query name \
            --output tsv)

          if [[ -z "$run_id" ]]; then
            echo "Azure ML job creation failed"
            exit 1
          fi

          echo "Azure ML Run ID: $run_id"
          echo "Requested job label: $JOB_NAME"

          echo "Monitoring pipeline execution..."

          while true; do
            status=$(az ml job show \
              --name "$run_id" \
              --resource-group "$RESOURCE_GROUP" \
              --workspace-name "$WORKSPACE_NAME" \
              --query status \
              --output tsv)

            echo "Pipeline status: $status"

            case "$status" in
              Completed)
                echo "Pipeline completed successfully!"
                exit 0
                ;;
              Failed|Canceled|CancelRequested)
                echo "Pipeline failed or was canceled."
                exit 1
                ;;
              NotStarted|Queued|Starting|Preparing|Running|Finalizing)
                sleep 30
                ;;
              *)
                echo "Unexpected pipeline status: $status"
                exit 1
                ;;
            esac
          done
