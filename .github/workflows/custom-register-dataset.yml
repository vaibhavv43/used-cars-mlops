
name: register-dataset

on:
  workflow_call:
    inputs:
      data_file:
        required: true
        type: string
      resource_group:
        required: true
        type: string
      workspace_name:
        required: true
        type: string
      file_type:
        required: false
        type: string
        default: ""
      name:
        required: true
        type: string

jobs:
  register-dataset:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Azure Login using OIDC
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Step 3: Verify Azure Login
      - name: Verify Azure Connection
        run: |
          az account show --output table

      # Step 4: Install Azure ML Extension
      - name: Install Azure ML Extension
        run: |
          az extension add --name ml --yes

      # Step 5: Update Azure ML Extension
      - name: Update Azure ML Extension
        run: |
          az extension update --name ml

      # Step 6: Register dataset from YAML file
      - name: Register Dataset
        if: ${{ inputs.file_type == '' }}
        env:
          DATA_FILE: ${{ inputs.data_file }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          DATASET_NAME: ${{ inputs.name }}
        run: |
          az ml data create \
            --file "$GITHUB_WORKSPACE/$DATA_FILE" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME" \
            --name "$DATASET_NAME"

      # Step 7: Submit Azure ML job
      - name: Submit Azure ML Job
        if: ${{ inputs.file_type != '' }}
        env:
          DATA_FILE: ${{ inputs.data_file }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
        run: |
          az ml job create \
            --file "$GITHUB_WORKSPACE/$DATA_FILE" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME"
